name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install -r requirements.lock

      - name: Run tests
        run: python -m pytest -q

      - name: Verify migration CLI on a fresh database
        env:
          JEV_MODE: mock
          API_AUTH_ENABLED: "false"
          DATABASE_URL: sqlite:///./ci-migration.db
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic check
          python -m alembic downgrade base

  container:
    name: Build and smoke-test container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image
        run: docker build --tag support-triage:ci .

      - name: Start container
        run: docker run --detach --name support-triage --publish 8000:8000 support-triage:ci

      - name: Wait for readiness
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs support-triage
          exit 1

      - name: Show logs after failure
        if: failure()
        run: docker logs support-triage

      - name: Stop container
        if: always()
        run: docker rm --force support-triage
